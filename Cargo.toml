[package]
name = "court-jester"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Confidence-calibrated verification for changed Python and TypeScript code"
repository = "https://github.com/slee1996/court-jester-mcp"
readme = "README.md"
keywords = ["verification", "python", "typescript", "code-quality"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "court-jester"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["resource"] }
libc = "0.2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tar = "0.4"

[dev-dependencies]
