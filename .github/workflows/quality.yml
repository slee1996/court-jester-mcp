name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate. Empty uses the triggering ref.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust integration targets
        run: cargo test --locked --tests -- --test-threads=1

      - name: Run benchmark unit tests
        run: python3 -m unittest bench.test_run_matrix bench.test_runner bench.test_summarize_runs bench.test_agent_trace bench.test_evidence bench.test_materialize_mutation bench.test_fuzz_effectiveness

      - name: Run release contract tests
        run: python3 -m unittest discover -s tests -p 'release_test.py'

      - name: Test repair evidence gate
        run: python3 -m unittest discover -s tests -p 'repair_contract_test.py'

      - name: Test onboarding evidence gate
        run: python3 -m unittest discover -s tests -p 'onboarding_test.py'

      - name: Build release binary
        run: cargo build --locked --release --bin court-jester

      - name: Run release CLI smoke test
        run: python3 scripts/smoke_cli.py --binary target/release/court-jester --verify-sample

      - name: Verify release-binary repair contract
        run: python3 scripts/check_repair_loop.py --binary target/release/court-jester --output target/repair-contract.json

      - name: Verify fresh-project onboarding
        run: python3 scripts/check_onboarding.py --binary target/release/court-jester --output target/onboarding-contract.json

      - name: Upload onboarding evidence
        if: ${{ !cancelled() && hashFiles('target/onboarding-contract.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/onboarding-contract.json

      - name: Upload repair contract evidence
        if: ${{ !cancelled() && hashFiles('target/repair-contract.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repair-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/repair-contract.json
          if-no-files-found: error

      - name: Run fuzz effectiveness benchmark
        run: python3 -m bench.fuzz_effectiveness --binary target/release/court-jester

      - name: Run locked benchmark dry-run
        run: python3 -m bench.run_matrix --task-set swebench-lite-pilot --models noop --policies baseline --dry-run --enforce-heldout-lock --output-dir /tmp/cj-heldout-dry
